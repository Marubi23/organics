<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mzuri Organics - Regenerative Agriculture & Circular Economy Solutions</title>
  <base href="/">

  <!-- Open Graph / Facebook -->

  <meta property="twitter:description" content="Circular bioeconomy solutions for regenerative agriculture in Kenya">

  <!-- Favicon -->
  <link rel="icon" type="image/JPG" href="/images/favicon.ico">

  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192x192.png"> 
  <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon-512x512.png"> 

  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Preload critical resources -->
  <link rel="preload" href="styles.css" as="style">
  
  <!-- OpenDyslexic Font for accessibility -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.min.css">
  
  <!-- Loading system styles -->
  <style>
    /* Critical loading styles - Inlined for immediate rendering */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: #f5f5dc;
      overflow-x: hidden;
    }
    
    /* App loading bar */
    #app-loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 4px;
      background: linear-gradient(90deg, hsl(125, 89%, 31%), hsl(31, 100%, 47%));
      z-index: 10000;
      transition: width 0.3s ease;
      box-shadow: 0 2px 8px rgba(62, 142, 11, 0.3);
    }
    
    #app-loading-bar.complete {
      opacity: 0;
      transition: opacity 0.5s ease 0.3s;
      pointer-events: none;
    }
    
    /* Full page loader - shown before Angular loads */
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f5f5dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      gap: 20px;
    }
    
    #initial-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    /* Brand text */
    .loader-brand {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: hsl(125, 89%, 31%);
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards 0.3s;
    }
    
    /* Minimal spinner */
    .minimal-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(62, 142, 11, 0.1);
      border-radius: 50%;
      border-top-color: hsl(125, 89%, 31%);
      border-right-color: hsl(31, 100%, 47%);
      animation: spin 1.2s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* App root styling */
    app-root {
      display: block;
      min-height: 100vh;
    }
    
    /* Performance optimizations */
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    
    /* Skip to content for accessibility */
    .skip-to-content {
      position: absolute;
      top: -40px;
      left: 0;
      background: hsl(125, 89%, 31%);
      color: white;
      padding: 8px 16px;
      z-index: 10001;
      text-decoration: none;
      font-weight: 500;
    }
    
    .skip-to-content:focus {
      top: 0;
    }
    
    /* ===== CART Z-INDEX FIX ===== */
    /* Cart overlay - Highest priority */
    .cart-overlay {
      z-index: 999999 !important;
    }
    
    /* Cart sidebar - Even higher */
    .cart-sidebar {
      z-index: 1000000 !important;
    }
    
    /* Body state when cart is open */
    body.cart-open {
      overflow: hidden;
    }
    
    body.cart-open .main-nav,
    body.cart-open .hero,
    body.cart-open .hero-slider-container,
    body.cart-open .categories-section,
    body.cart-open .features-section,
    body.cart-open .search-overlay,
    body.cart-open .quick-view-modal-overlay,
    body.cart-open .floating-cart,
    body.cart-open .toast-container,
    body.cart-open .add-success-message {
      z-index: auto !important;
    }
    
    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      
      .minimal-spinner {
        animation: none;
        border-top-color: rgba(62, 142, 11, 0.3);
      }
      
      .loader-brand {
        animation: none;
        opacity: 1;
      }
    }
    
    /* Mobile responsiveness */
    @media (max-width: 480px) {
      .loader-brand {
        font-size: 1.5rem;
      }
      
      .minimal-spinner {
        width: 50px;
        height: 50px;
      }
    }

    /* ============ WORKING ACCESSIBILITY STYLES ============ */
   
    .font-normal h1 { font-size: 3rem; } /* Original hero title */
    .font-normal h2 { font-size: 2.5rem; } /* Original section titles */
    .font-normal h3 { font-size: 1.5rem; } /* Original feature titles */
    .font-normal p { font-size: 1.2rem; } /* Original hero description */
    .font-normal .nav-link { font-size: 0.9rem; } /* Original nav links */
    .font-normal .category-name { font-size: 1.1rem; } /* Original category names */
    
    /* Small font - 10% smaller than original */
    .font-small h1 { font-size: 2.7rem !important; }
    .font-small h2 { font-size: 2.25rem !important; }
    .font-small h3 { font-size: 1.35rem !important; }
    .font-small p { font-size: 1.08rem !important; }
    .font-small .nav-link { font-size: 0.81rem !important; }
    .font-small .category-name { font-size: 0.99rem !important; }
    
    /* Medium font - 10% larger than original */
    .font-medium h1 { font-size: 3.3rem !important; }
    .font-medium h2 { font-size: 2.75rem !important; }
    .font-medium h3 { font-size: 1.65rem !important; }
    .font-medium p { font-size: 1.32rem !important; }
    .font-medium .nav-link { font-size: 0.99rem !important; }
    .font-medium .category-name { font-size: 1.21rem !important; }
    
    /* Large font - 20% larger than original */
    .font-large h1 { font-size: 3.6rem !important; }
    .font-large h2 { font-size: 3.0rem !important; }
    .font-large h3 { font-size: 1.8rem !important; }
    .font-large p { font-size: 1.44rem !important; }
    .font-large .nav-link { font-size: 1.08rem !important; }
    .font-large .category-name { font-size: 1.32rem !important; }
    
    /* Extra Large font - 30% larger than original */
    .font-xlarge h1 { font-size: 3.9rem !important; }
    .font-xlarge h2 { font-size: 3.25rem !important; }
    .font-xlarge h3 { font-size: 1.95rem !important; }
    .font-xlarge p { font-size: 1.56rem !important; }
    .font-xlarge .nav-link { font-size: 1.17rem !important; }
    .font-xlarge .category-name { font-size: 1.43rem !important; }

    /* High Contrast Mode */
    .high-contrast {
      filter: contrast(1.4) brightness(1.1);
    }
    
    .high-contrast body {
      background: #000000 !important;
      color: #ffffff !important;
    }
    
    .high-contrast a,
    .high-contrast button,
    .high-contrast .nav-link,
    .high-contrast .nav-icon,
    .high-contrast .logo,
    .high-contrast .btn {
      color: #ffff00 !important;
      border-color: #ffff00 !important;
    }
    
    .high-contrast .main-nav,
    .high-contrast .top-bar,
    .high-contrast .hero,
    .high-contrast .categories-section,
    .high-contrast .features-section,
    .high-contrast .footer {
      background: #000000 !important;
      border-bottom: 2px solid #ffff00;
    }
    
    .high-contrast img {
      filter: brightness(0.9) contrast(1.3);
      border: 2px solid #ffff00;
    }
    
    .high-contrast .container {
      background: #000000;
    }

    /* Reduced Motion */
    .reduced-motion *,
    .reduced-motion *::before,
    .reduced-motion *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    
    .reduced-motion .minimal-spinner {
      animation: none !important;
    }

    /* Line Spacing */
    .line-spacing-relaxed,
    .line-spacing-relaxed p,
    .line-spacing-relaxed li,
    .line-spacing-relaxed .nav-link,
    .line-spacing-relaxed .hero-description,
    .line-spacing-relaxed .feature-item p {
      line-height: 1.8 !important;
    }
    
    .line-spacing-loose,
    .line-spacing-loose p,
    .line-spacing-loose li,
    .line-spacing-loose .nav-link,
    .line-spacing-loose .hero-description,
    .line-spacing-loose .feature-item p {
      line-height: 2.2 !important;
    }

    /* Letter Spacing */
    .letter-spacing-wide,
    .letter-spacing-wide * {
      letter-spacing: 0.05em !important;
    }
    
    .letter-spacing-wider,
    .letter-spacing-wider * {
      letter-spacing: 0.1em !important;
    }

    /* Readable Font (Dyslexia-friendly) */
    .readable-font,
    .readable-font * {
      font-family: 'OpenDyslexic', 'Comic Sans MS', 'Arial', sans-serif !important;
      font-weight: 500 !important;
      word-spacing: 0.1em !important;
    }

    /* Focus Indicators */
    .focus-indicators :focus {
      outline: 4px solid #ff0000 !important;
      outline-offset: 4px !important;
      box-shadow: 0 0 0 8px rgba(255, 255, 0, 0.3) !important;
      transition: outline 0.1s ease;
    }
    
    .focus-indicators button:focus,
    .focus-indicators a:focus,
    .focus-indicators input:focus,
    .focus-indicators select:focus {
      outline: 4px solid #ff0000 !important;
    }
  </style>
</head>
<body>
  <!-- Skip to content link for accessibility -->
  <a href="#main-content" class="skip-to-content">Skip to main content</a>
  
  <!-- App loading progress bar -->
  <div id="app-loading-bar"></div>
  
  <!-- Initial loader - shown before Angular app loads -->
  <div id="initial-loader">
    <div class="loader-brand">Mzuri Organics</div>
    <div class="minimal-spinner"></div>
  </div>
  
  <!-- Angular app root -->
  <app-root></app-root>
  
  <!-- Loading system scripts -->
  <script>
    // Performance monitoring
    const startTime = performance.now();
    
    // Initial loader and progress bar
    const initialLoader = document.getElementById('initial-loader');
    const appLoadingBar = document.getElementById('app-loading-bar');
    
    // App loading progress bar
    let appProgress = 0;
    const appProgressInterval = setInterval(() => {
      appProgress += Math.random() * 12;
      if (appProgress >= 80) {
        appProgress = 80;
      }
      appLoadingBar.style.width = appProgress + '%';
    }, 150);
    
    // Hide initial loader when Angular is ready
    window.addEventListener('AngularReady', () => {
      // Complete progress bar
      appLoadingBar.style.width = '100%';
      
      // Clear interval
      clearInterval(appProgressInterval);
      
      // Hide initial loader
      setTimeout(() => {
        initialLoader.classList.add('hidden');
        
        // Complete app loading bar
        setTimeout(() => {
          appLoadingBar.classList.add('complete');
          
          // Log performance
          const loadTime = performance.now() - startTime;
          console.log(`🚀 Mzuri Organics loaded in ${Math.round(loadTime)}ms`);
        }, 300);
      }, 500);
    });
    
    // Safety timeout - hide loader after 6 seconds max
    setTimeout(() => {
      if (!initialLoader.classList.contains('hidden')) {
        console.log('Safety timeout triggered - forcing loader hide');
        initialLoader.classList.add('hidden');
        appLoadingBar.style.width = '100%';
        setTimeout(() => {
          appLoadingBar.classList.add('complete');
        }, 300);
      }
    }, 6000);
    
    // Error handling
    window.addEventListener('error', (event) => {
      console.error('Page error:', event.error);
      // Hide loader on error to prevent stuck state
      setTimeout(() => {
        initialLoader.classList.add('hidden');
        appLoadingBar.classList.add('complete');
      }, 1000);
    });
    
    // Before unload event
    window.addEventListener('beforeunload', () => {
      // Show loading state for navigation
      appLoadingBar.style.width = '0%';
      appLoadingBar.classList.remove('complete');
    });
    
    // Performance observer
    if ('PerformanceObserver' in window) {
      const observer = new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) {
          console.log(`${entry.name}: ${entry.duration.toFixed(2)}ms`);
        }
      });
      observer.observe({ entryTypes: ['largest-contentful-paint', 'first-input'] });
    }
    
    // ===== CART Z-INDEX FIX - DYNAMIC BODY CLASS =====
    // Listen for cart open/close events
    document.addEventListener('cart-opened', function() {
      document.body.classList.add('cart-open');
    });
    
    document.addEventListener('cart-closed', function() {
      document.body.classList.remove('cart-open');
    });
    
    // Fallback: check for cart overlay every 500ms
    setInterval(function() {
      const cartOverlay = document.querySelector('.cart-overlay.active');
      if (cartOverlay) {
        document.body.classList.add('cart-open');
      } else {
        document.body.classList.remove('cart-open');
      }
    }, 500);

    // ===== ACCESSIBILITY MANAGER =====
    // This ensures all accessibility features work with your Angular component
    window.AccessibilityManager = {
      settings: {
        fontSize: 'normal', // Changed from 'medium' to 'normal' to match original
        highContrast: false,
        reducedMotion: false,
        lineSpacing: 'normal',
        letterSpacing: 'normal',
        readableFont: false,
        focusIndicators: false
      },
      
      fontSizeLevels: ['small', 'normal', 'medium', 'large', 'xlarge'], // 5 levels now
      
      init: function() {
        this.loadSettings();
        this.applyAll();
        console.log('✅ Accessibility Manager initialized');
      },
      
      loadSettings: function() {
        try {
          const saved = localStorage.getItem('mzuri_accessibility');
          if (saved) {
            this.settings = JSON.parse(saved);
          }
        } catch (e) {
          console.error('Error loading settings:', e);
        }
      },
      
      saveSettings: function() {
        localStorage.setItem('mzuri_accessibility', JSON.stringify(this.settings));
      },
      
      applyAll: function() {
        // Remove all classes first
        const classes = [
          'font-small', 'font-normal', 'font-medium', 'font-large', 'font-xlarge',
          'high-contrast', 'reduced-motion',
          'line-spacing-normal', 'line-spacing-relaxed', 'line-spacing-loose',
          'letter-spacing-normal', 'letter-spacing-wide', 'letter-spacing-wider',
          'readable-font', 'focus-indicators'
        ];
        document.body.classList.remove(...classes);
        
        // Apply font size
        document.body.classList.add(`font-${this.settings.fontSize}`);
        
        // Apply high contrast
        if (this.settings.highContrast) {
          document.body.classList.add('high-contrast');
        }
        
        // Apply reduced motion
        if (this.settings.reducedMotion) {
          document.body.classList.add('reduced-motion');
        }
        
        // Apply line spacing
        if (this.settings.lineSpacing !== 'normal') {
          document.body.classList.add(`line-spacing-${this.settings.lineSpacing}`);
        }
        
        // Apply letter spacing
        if (this.settings.letterSpacing !== 'normal') {
          document.body.classList.add(`letter-spacing-${this.settings.letterSpacing}`);
        }
        
        // Apply readable font
        if (this.settings.readableFont) {
          document.body.classList.add('readable-font');
        }
        
        // Apply focus indicators
        if (this.settings.focusIndicators) {
          document.body.classList.add('focus-indicators');
        }
      },
      
      // Methods for Angular component to call
      increaseFontSize: function() {
        const currentIndex = this.fontSizeLevels.indexOf(this.settings.fontSize);
        if (currentIndex < this.fontSizeLevels.length - 1) {
          this.settings.fontSize = this.fontSizeLevels[currentIndex + 1];
          this.applyAll();
          this.saveSettings();
        }
        return this.getFontSizeLabel();
      },
      
      decreaseFontSize: function() {
        const currentIndex = this.fontSizeLevels.indexOf(this.settings.fontSize);
        if (currentIndex > 0) {
          this.settings.fontSize = this.fontSizeLevels[currentIndex - 1];
          this.applyAll();
          this.saveSettings();
        }
        return this.getFontSizeLabel();
      },
      
      setFontSize: function(size) {
        if (this.fontSizeLevels.includes(size)) {
          this.settings.fontSize = size;
          this.applyAll();
          this.saveSettings();
        }
      },
      
      setHighContrast: function(enabled) {
        this.settings.highContrast = enabled;
        this.applyAll();
        this.saveSettings();
      },
      
      setReducedMotion: function(enabled) {
        this.settings.reducedMotion = enabled;
        this.applyAll();
        this.saveSettings();
      },
      
      setLineSpacing: function(spacing) {
        if (['normal', 'relaxed', 'loose'].includes(spacing)) {
          this.settings.lineSpacing = spacing;
          this.applyAll();
          this.saveSettings();
        }
      },
      
      setLetterSpacing: function(spacing) {
        if (['normal', 'wide', 'wider'].includes(spacing)) {
          this.settings.letterSpacing = spacing;
          this.applyAll();
          this.saveSettings();
        }
      },
      
      setReadableFont: function(enabled) {
        this.settings.readableFont = enabled;
        this.applyAll();
        this.saveSettings();
      },
      
      setFocusIndicators: function(enabled) {
        this.settings.focusIndicators = enabled;
        this.applyAll();
        this.saveSettings();
      },
      
      resetAll: function() {
        this.settings = {
          fontSize: 'normal',
          highContrast: false,
          reducedMotion: false,
          lineSpacing: 'normal',
          letterSpacing: 'normal',
          readableFont: false,
          focusIndicators: false
        };
        this.applyAll();
        this.saveSettings();
      },
      
      getFontSizeLabel: function() {
        const labels = { 
          small: 'A-', 
          normal: 'A', 
          medium: 'A+', 
          large: 'A++', 
          xlarge: 'A+++' 
        };
        return labels[this.settings.fontSize] || 'A';
      },
      
      canIncrease: function() {
        const currentIndex = this.fontSizeLevels.indexOf(this.settings.fontSize);
        return currentIndex < this.fontSizeLevels.length - 1;
      },
      
      canDecrease: function() {
        const currentIndex = this.fontSizeLevels.indexOf(this.settings.fontSize);
        return currentIndex > 0;
      }
    };
    
    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => window.AccessibilityManager.init());
    } else {
      window.AccessibilityManager.init();
    }
  </script>
  
  <!-- Fonts (non-blocking) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Service Worker Registration (optional) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').then(registration => {
          console.log('ServiceWorker registration successful');
        }).catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
  
  <!-- Lottie Player for animations -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</body>

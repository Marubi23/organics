<!-- Simple Testimonials Section -->

<section class="testimonials-section">
  <div class="container">
    <!-- Heading -->
    <div class="section-header">
      <span class="subtitle">Real Voices</span>
      <h2>What Our <span class="gold">Community</span> Says</h2>
    </div>

    <!-- Testimonial Carousel -->
    <div class="testimonial-wrapper">
      <div class="testimonial-card" [@fadeSlide]="currentIndex">
        <!-- Quote -->
        <div class="quote-icon">
          <i class="fas fa-quote-left"></i>
        </div>
        
        <blockquote class="testimonial-quote">
          "{{ currentTestimonial.quote }}"
        </blockquote>

        <!-- Profile -->
        <div class="profile">
          <div class="profile-image-wrapper">
            <!-- Skeleton -->
     
          </div>
          <div class="profile-info">
            <h4 class="name">{{ currentTestimonial.name }}</h4>
            <p class="role">{{ currentTestimonial.role }}</p>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="control-btn prev" (click)="previousTestimonial()">
          <i class="fas fa-chevron-left"></i>
        </button>
        
        <div class="dots">
          <span 
            class="dot" 
            *ngFor="let t of testimonials; let i = index"
            [class.active]="i === currentIndex"
            (click)="goToTestimonial(i)"
          ></span>
        </div>
        
        <button class="control-btn next" (click)="nextTestimonial()">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
</section>

<app-cart></app-cart>

<nav class="main-nav" #headerElement [class.header-hidden]="isHeaderHidden">
  <div class="container">
    <div class="nav-content">
      <!-- Logo -->
      <div class="logo" routerLink="/home" title="Mzuri Organics Home">
        <img src="/images/mzuri.JPG" alt="Mzuri Organics" class="logo-img">
        <div class="header-tip" *ngIf="isHeaderHidden">
          <i class="fas fa-chevron-down"></i>
          Scroll up to show
        </div>
      </div>
      
      <!-- Navigation Links (Hidden on mobile) -->
      <div class="nav-links">
        <div class="nav-link-container" *ngFor="let navItem of navItems; let i = index">
          <a 
            *ngIf="!navItem.children" 
            [routerLink]="navItem.route" 
            class="nav-link"
            [class.active]="isActive(navItem.route)">
            <i [class]="navItem.icon"></i>
            <span class="nav-text">{{ navItem.text }}</span>
          </a>
          
          <div *ngIf="navItem.children" class="dropdown">
            <a class="nav-link dropdown-toggle" 
               (mouseenter)="showDropdown(i)"
               (mouseleave)="hideDropdown(i)"
               (click)="toggleDropdown(i)">
              <i [class]="navItem.icon"></i>
              <span class="nav-text">{{ navItem.text }}</span>
              <i class="dropdown-arrow fas fa-chevron-down"></i>
            </a>
            
            <!-- Simple Dropdown -->
            <div class="dropdown-menu" 
                 [class.visible]="activeDropdown === i"
                 (mouseenter)="keepDropdownOpen(i)"
                 (mouseleave)="hideDropdown(i)">
              <div *ngFor="let child of navItem.children" class="dropdown-item">
                <a [routerLink]="child.route" 
                   [fragment]="child.fragment"
                   (click)="navigateAndClose(child)">
                  <i [class]="child.icon"></i>
                  <div class="dropdown-content">
                    <span class="item-text">{{ child.text }}</span>
                    <span class="item-description">{{ child.description }}</span>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Actions - Icon Only -->
      <div class="nav-right">
        <!-- Mobile Hamburger Button (Visible on mobile) -->
        <div class="mobile-nav-toggle">
          <button class="hamburger-button" 
            [class.active]="isMobileMenuOpen"
            (click)="toggleMobileMenu()"
            aria-label="Toggle mobile menu"
            title="Menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>

        <!-- Quick Menu for Hidden State -->
        <button class="quick-menu-btn" 
                *ngIf="isHeaderHidden"
                (click)="toggleQuickMenu()"
                [class.active]="isQuickMenuOpen"
                title="Quick Menu">
          <i class="fas fa-ellipsis-h"></i>
        </button>

        <!-- Icon Only Actions (Visible when header is shown) -->
        <div class="icon-actions" *ngIf="!isHeaderHidden">
          <!-- Search -->
          <button class="nav-icon" 
                  (click)="openSearch()"
                  title="Search Products">
            <i class="fas fa-search"></i>
            <span class="icon-tooltip">Search</span>
          </button>
          
          <!-- Cart -->
          <button class="nav-icon cart-icon" 
                  (click)="toggleCart()"
                  title="Shopping Cart">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
            <span class="icon-tooltip">Cart</span>
          </button>
          
          <!-- Account -->
          <button class="nav-icon account-icon" 
                  (click)="toggleAccountMenu()"
                  [class.active]="isAccountMenuOpen"
                  title="My Account">
            <div class="avatar-circle" *ngIf="currentUser; else guestIcon">
              {{ getUserInitials() }}
            </div>
            <ng-template #guestIcon>
              <i class="fas fa-user"></i>
            </ng-template>
            <span class="icon-tooltip">Account</span>
          </button>
          
          <!-- Settings/Accessibility -->
          <button class="nav-icon settings-icon" 
                  (click)="toggleSettingsMenu()"
                  [class.active]="isSettingsMenuOpen"
                  title="Accessibility Settings">
            <i class="fas fa-universal-access"></i>
            <span class="icon-tooltip">Accessibility</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Accessibility Settings Menu Component -->
  <app-accessibility-menu 
    *ngIf="isSettingsMenuOpen"
    (close)="toggleSettingsMenu()">
  </app-accessibility-menu>

  <!-- Account Menu Component -->
  <app-account-menu 
    *ngIf="isAccountMenuOpen"
    [currentUser]="currentUser"
    (close)="toggleAccountMenu()"
    (logout)="logout()">
  </app-account-menu>

  <!-- Search Overlay Component -->
  <app-search-overlay 
    *ngIf="isSearchOpen"
    (close)="closeSearch()">
  </app-search-overlay>
</nav>

<!-- Mobile Menu Component -->
<app-hamburger-menu 
  [isOpen]="isMobileMenuOpen"
  (closeMenu)="toggleMobileMenu()">
</app-hamburger-menu>

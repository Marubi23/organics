<!-- Global blur overlay -->
<div class="global-overlay" *ngIf="showOverlay" (click)="handleEscape()"></div>

<nav class="main-nav" #headerElement [class.scrolled]="isScrolled" [class.header-hidden]="isHeaderHidden">
  <div class="nav-inner">

    <!-- Logo - Fixed with proper blending -->
    <a class="nav-logo" routerLink="/home" title="Mzuri Organics Home">
      <div class="logo-container">
        <img src="/images/new-mzuri-logo.png" alt="Mzuri Organics" class="logo-img" onerror="this.src='/images/logo-placeholder.png'" />
      </div>
    </a>

    <!-- Desktop Nav Links -->
    <ul class="nav-links">
      <li *ngFor="let item of navItems; let i = index" class="nav-item">

        <!-- Simple link -->
        <a *ngIf="!item.children"
           [routerLink]="item.route"
           class="nav-link"
           [class.active]="isActive(item.route)">
          {{ item.text }}
        </a>

        <!-- Dropdown -->
        <div *ngIf="item.children" class="nav-dropdown"
             (mouseenter)="showDropdown(i)"
             (mouseleave)="hideDropdown(i)">
          <button class="nav-link dropdown-toggle" [class.active]="activeDropdown === i">
            {{ item.text }}
            <svg class="chevron" [class.open]="activeDropdown === i" width="12" height="12" viewBox="0 0 24 24" fill="none">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="dropdown-panel" [class.visible]="activeDropdown === i"
               (mouseenter)="keepDropdownOpen(i)"
               (mouseleave)="hideDropdown(i)">
            <a *ngFor="let child of item.children"
               [routerLink]="child.route"
               [fragment]="child.fragment"
               class="dropdown-item"
               (click)="navigateAndClose(child)">
              <div class="dropdown-item-body">
                <span class="dropdown-item-label">{{ child.text }}</span>
                <span class="dropdown-item-desc">{{ child.description }}</span>
              </div>
              <svg class="item-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
        </div>
      </li>
    </ul>

    <!-- Right Actions -->
    <div class="nav-actions">

      <!-- Search -->
      <button class="nav-icon-btn" (click)="openSearch()" title="Search" aria-label="Search products">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Cart -->
      <button class="nav-icon-btn cart-btn" (click)="toggleCart()" title="Cart" aria-label="Shopping cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </button>

      <!-- Account -->
      <div class="nav-dropdown account-dropdown"
           (mouseenter)="showAccountDropdown()"
           (mouseleave)="hideAccountDropdown()">
        <button class="nav-icon-btn account-btn"
                [class.active]="isAccountMenuOpen"
                (click)="toggleAccountDropdown()"
                title="Account" aria-label="My account">
          <div class="avatar" *ngIf="currentUser; else guestAvatar">{{ getUserInitials() }}</div>
          <ng-template #guestAvatar>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
            </svg>
          </ng-template>
        </button>

        <div class="dropdown-panel account-panel" [class.visible]="isAccountMenuOpen"
             (mouseenter)="keepAccountDropdownOpen()"
             (mouseleave)="hideAccountDropdown()">

          <div class="account-identity" *ngIf="currentUser">
            <div class="account-avatar-lg">{{ getUserInitials() }}</div>
            <div class="account-meta">
              <div class="account-name">{{ currentUser.fullName }}</div>
              <div class="account-email">{{ currentUser.email }}</div>
            </div>
          </div>
          <div class="account-identity" *ngIf="!currentUser">
            <div class="account-avatar-lg guest">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </div>
            <div class="account-meta">
              <div class="account-name">Welcome</div>
              <div class="account-email">Guest visitor</div>
            </div>
          </div>

          <div class="panel-divider"></div>

          <button class="panel-item" (click)="navigateToPage('/blog')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="panel-item-content">
              <span class="panel-item-label">Blog</span>
              <span class="panel-item-desc">News &amp; insights</span>
            </div>
          </button>

          <button class="panel-item" (click)="navigateToPage('/faq')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="12" y1="17" x2="12.01" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="panel-item-content">
              <span class="panel-item-label">FAQs</span>
              <span class="panel-item-desc">Frequently asked questions</span>
            </div>
          </button>

          <button class="panel-item" *ngIf="!currentUser" (click)="navigateToPage('/testimonials')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="panel-item-content">
              <span class="panel-item-label">Testimonials</span>
              <span class="panel-item-desc">What farmers say about us</span>
            </div>
          </button>

          <div class="panel-divider"></div>

          <button class="panel-item logout-item" *ngIf="currentUser" (click)="logout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="panel-item-content">
              <span class="panel-item-label">Sign Out</span>
              <span class="panel-item-desc">Log out of your account</span>
            </div>
          </button>

        </div>
      </div>

      <!-- Accessibility -->
      <button class="nav-icon-btn"
              [class.active]="isSettingsMenuOpen"
              (click)="toggleSettingsMenu()"
              title="Accessibility settings"
              aria-label="Accessibility settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
          <path d="M12 7v6m0 0l-3 5m3-5l3 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 10h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Shop CTA -->
      <a routerLink="/products" class="nav-cta">Shop Now</a>

      <!-- Hamburger -->
      <button class="hamburger"
              [class.open]="isMobileMenuOpen"
              (click)="toggleMobileMenu()"
              aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<!-- Sub-components -->
<app-accessibility-menu
  *ngIf="isSettingsMenuOpen"
  (close)="toggleSettingsMenu()">
</app-accessibility-menu>

<app-account-menu
  *ngIf="isAccountMenuComponentOpen"
  [currentUser]="currentUser"
  (close)="toggleAccountMenuComponent()"
  (logout)="logout()">
</app-account-menu>

<app-search-overlay
  *ngIf="isSearchOpen"
  (close)="closeSearch()">
</app-search-overlay>

<app-hamburger-menu
  [isOpen]="isMobileMenuOpen"
  (closeMenu)="toggleMobileMenu()">
</app-hamburger-menu>

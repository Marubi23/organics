<!-- features.component.html -->
<section class="features-section">
  <div class="container">
    <!-- Section Header -->
    <div class="features-header">
      <h2 class="section-title">Talk to Us Today</h2>
      <p class="section-subtitle">Connect with our team for expert agricultural advice</p>
    </div>
    
    <!-- Lottie WhatsApp Icon -->
    <div class="lottie-whatsapp">
      <lottie-player
        src="/assets/animations/lottieflow-social-networks-16-11-2d6a2e-easey.json"
        background="transparent"
        speed="1"
        style="width: 120px; height: 120px; margin: 0 auto;"
        loop
        autoplay>
      </lottie-player>
      <div class="lottie-caption">
            <a  href="https://wa.me/254701934918" class="info-action" target="_blank">Click Here to Redirect to WhatsApp</a>
      </div>
     
    </div>

    <!-- Stats Counter -->
    <div class="features-stats">
      <div class="stat-item" *ngFor="let stat of stats">
        <div class="stat-number">{{ stat.value }}</div>
        <div class="stat-label">{{ stat.label }}</div>
      </div>
    </div>
  </div>
</section>

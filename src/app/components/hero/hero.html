<section class="hero-slider">
  <div class="slider-container">
    <!-- Slides -->
    <div class="slides" [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
      <div *ngFor="let slide of slides; let i = index" class="slide" [class.active]="i === currentSlide">
        <div class="slide-background">
          <div *ngIf="slide.isVideo; else imageSlide" class="video-container">
            <video autoplay muted loop playsinline class="background-video">
              <source [src]="slide.image" type="video/mp4">
              Your browser does not support the video tag.
            </video>
            <div class="video-overlay"></div>
          </div>
          <ng-template #imageSlide>
            <img [src]="slide.image" [alt]="slide.title" class="background-image">
            <div class="image-overlay"></div>
          </ng-template>
        </div>
        
        <div class="container">
          <div class="slide-content">
            <div class="text-content">
              <h1 class="slide-title">{{ slide.title }}</h1>
              <p class="slide-description">{{ slide.description }}</p>
              <div class="slide-buttons">
                <a [routerLink]="slide.buttonLink" class="btn btn-primary">
                  {{ slide.buttonText }}
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Arrows -->
    <button class="slider-nav prev" (click)="prevSlide()">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="slider-nav next" (click)="nextSlide()">
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Slide Indicators -->
    <div class="slide-indicators">
      <button 
        *ngFor="let slide of slides; let i = index" 
        class="indicator" 
        [class.active]="i === currentSlide"
        (click)="goToSlide(i)">
      </button>
    </div>
  </div>
</section>

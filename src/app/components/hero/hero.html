<section class="hero-slider">
  <!-- Progress Bar at the top -->
  <div class="slide-progress-bar" *ngIf="!isUserInteracting">
    <div class="progress-track" [style.width]="progressBarWidth + '%'"></div>
  </div>
  
  <div class="slider-container">
    <!-- Slides Container -->
    <div class="slides" [style.transform]="transformValue">
      <div *ngFor="let slide of slides; let i = index" 
           class="slide" 
           [class.active]="i === currentSlide"
           [class.slide-exit]="i === currentSlide && isAnimating"
           [class.slide-enter]="i === nextSlideIndex && isAnimating">
        
        <div class="slide-background">
          <div class="image-container">
            <img 
              [src]="slide.image" 
              [alt]="slide.title" 
              class="background-image"
              (load)="onImageLoad(i)"
              loading="lazy">
            <div class="image-overlay"></div>
          </div>
        </div>
        
        <!-- Content that appears immediately with photo -->
        <div class="container">
          <div class="slide-content" [class.content-visible]="i === currentSlide">
            <div class="text-content">
              <h1 class="slide-title">{{ slide.title }}</h1>
              <p class="slide-description">{{ slide.description }}</p>
              <div class="slide-buttons">
                <a routerLink="/products" class="btn btn-primary shop-now-btn" (click)="onUserInteraction()">
                  <i class="fas fa-shopping-bag"></i>
                  Shop Now
                </a>
                <a *ngIf="i !== 2; else videoButton" 
                   [routerLink]="slide.buttonLink" 
                   class="btn btn-secondary" 
                   (click)="onUserInteraction()">
                  {{ slide.buttonText }}
                </a>
                <ng-template #videoButton>
                  <button class="btn btn-secondary video-play-btn" 
                          (click)="playMiniVideo(); onUserInteraction()">
                    <i class="fas fa-play-circle"></i> {{ slide.buttonText }}
                  </button>
                </ng-template>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <button class="slider-nav prev" (click)="prevSlide(); onUserInteraction()">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="slider-nav next" (click)="nextSlide(); onUserInteraction()">
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Indicators -->
    <div class="slide-indicators">
      <button 
        *ngFor="let slide of slides; let i = index" 
        class="indicator" 
        [class.active]="i === currentSlide"
        (click)="goToSlide(i); onUserInteraction()">
        <div class="indicator-progress" *ngIf="i === currentSlide && !isUserInteracting"></div>
      </button>
    </div>
  </div>

  <!-- Mini Video Player (Hidden by default) -->
  <div class="mini-video-player" [class.visible]="showMiniVideo">
    <div class="video-header">
      <span>Our Story</span>
      <button class="video-close" (click)="closeMiniVideo()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <video #miniVideo class="mini-video" controls>
      <source src="videos/miniplay.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="video-controls">
      <button class="control-btn" (click)="togglePlayPause()">
        <i class="fas" [class.fa-play]="!isVideoPlaying" [class.fa-pause]="isVideoPlaying"></i>
      </button>
      <button class="control-btn" (click)="toggleMute()">
        <i class="fas" [class.fa-volume-up]="!isVideoMuted" [class.fa-volume-mute]="isVideoMuted"></i>
      </button>
      <button class="control-btn fullscreen-btn" (click)="toggleFullscreen()">
        <i class="fas fa-expand"></i>
      </button>
    </div>
  </div>
</section>

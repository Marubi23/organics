<section class="hero-slider" [class.animating]="animationClass">
  <div class="slider-container">
    <!-- Slides Container with Animation Class -->
    <div class="slides" [style.transform]="transformValue" [class.animate]="animationClass">
      <div *ngFor="let slide of slides; let i = index" 
           class="slide" 
           [class.active]="i === currentSlide"
           [class.slide-exit]="animationClass && i === currentSlide"
           [class.slide-enter]="animationClass && i === ((currentSlide + 1) % slides.length)">
        
        <!-- Animation Overlay -->
        <div class="animation-overlay" *ngIf="animationClass && i === currentSlide"></div>
        
        <div class="slide-background">
          <!-- Video Slide -->
          <div *ngIf="slide.isVideo; else imageSlide" class="video-container">
            <video 
              #videoElement
              autoplay 
              muted 
              loop 
              playsinline 
              class="background-video"
              (play)="onVideoPlay()"
              (pause)="onVideoPause()"
              (ended)="onVideoEnded()">
              <source src="videos/agricvid.webm" type="video/webm">
              <source src="videos/agricvid.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
            <div class="video-overlay"></div>
          </div>
          
          <!-- Image Slide -->
          <ng-template #imageSlide>
            <img [src]="slide.image" [alt]="slide.title" class="background-image">
            <div class="image-overlay"></div>
          </ng-template>
        </div>
        
        <!-- Content -->
        <div class="container">
          <div class="slide-content">
            <div class="text-content">
              <h1 class="slide-title">{{ slide.title }}</h1>
              <p class="slide-description">{{ slide.description }}</p>
              <div class="slide-buttons">
                <a routerLink="/products" class="btn btn-primary shop-now-btn" (click)="onUserInteraction()">
                  <i class="fas fa-shopping-bag"></i>
                  Shop Now
                </a>
                <a [routerLink]="slide.buttonLink" class="btn btn-secondary" (click)="onUserInteraction()">
                  {{ slide.buttonText }}
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <button class="slider-nav prev" (click)="prevSlide(); onUserInteraction()">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="slider-nav next" (click)="nextSlide(); onUserInteraction()">
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Indicators -->
    <div class="slide-indicators">
      <button 
        *ngFor="let slide of slides; let i = index" 
        class="indicator" 
        [class.active]="i === currentSlide"
        (click)="goToSlide(i); onUserInteraction()">
        <div class="indicator-progress" *ngIf="i === currentSlide"></div>
      </button>
    </div>
  </div>
</section>

<!-- Simple Dropdown Menu -->
<div class="menu-overlay" [class.open]="isOpen" (click)="onClose()">
  <div class="dropdown-menu" [class.open]="isOpen" (click)="$event.stopPropagation()">
    
    <!-- Close Button -->
    <button class="close-btn" (click)="onClose()">
      <i class="fas fa-times"></i>
    </button>

    <!-- Menu Items -->
    <nav class="menu-nav">
      <!-- Simple Links -->
      <a *ngFor="let item of menuItems" 
         [routerLink]="item.route" 
         class="nav-link"
         [class.active]="isActive(item.route)"
         (click)="onClose()">
        {{ item.text }}
      </a>

      <!-- About with Dropdown -->
      <div class="nav-item">
        <button class="nav-link dropdown-toggle" 
                (click)="toggleAbout()"
                [class.active]="isAboutOpen">
          About
          <span class="dropdown-icon">{{ isAboutOpen ? '−' : '+' }}</span>
        </button>
        <div class="dropdown-submenu" [class.open]="isAboutOpen">
          <a *ngFor="let child of aboutChildren" 
             [routerLink]="child.route" 
             class="submenu-link"
             (click)="onClose()">
            {{ child.text }}
          </a>
        </div>
      </div>

      <!-- Products with Dropdown -->
      <div class="nav-item">
        <button class="nav-link dropdown-toggle" 
                (click)="toggleProducts()"
                [class.active]="isProductsOpen">
          Products
          <span class="dropdown-icon">{{ isProductsOpen ? '−' : '+' }}</span>
        </button>
        <div class="dropdown-submenu" [class.open]="isProductsOpen">
          <a *ngFor="let child of productChildren" 
             [routerLink]="child.route" 
             class="submenu-link"
             (click)="onClose()">
            {{ child.text }}
          </a>
        </div>
      </div>
    </nav>

    <!-- Footer Links -->
    <div class="menu-footer">
      <a routerLink="/contact" class="footer-link" (click)="onClose()">Contact</a>
      <a routerLink="/faq" class="footer-link" (click)="onClose()">FAQ</a>
      <a routerLink="/testimonials" class="footer-link" (click)="onClose()">Testimonials</a>
    </div>

  </div>
</div>
